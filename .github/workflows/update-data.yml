# 평일 저녁마다 공공데이터포털에서 시세를 받아 data/ 폴더를 갱신하고 커밋한다
# 공공데이터포털 시세는 하루 늦게 올라온다 (오늘 받으면 보통 전 거래일 종가)
# 인증키는 저장소 Settings → Secrets and variables → Actions의 DATA_GO_KR_KEY
# Actions 탭에서 'Run workflow'로 바로 실행할 수도 있다

name: 시세 데이터 갱신

on:
  schedule:
    - cron: "0 9 * * 1-5" # 평일 18:00 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 시세 받기
        run: node scripts/fetch-data.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}

      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
            exit 0
          fi
          git commit -m "시세 데이터 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
