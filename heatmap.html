<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>섹터 히트맵 | 시장노트</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="heatmap">
    <!-- 상단 바 -->
    <header class="gnb">
      <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="메뉴 열기">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
      </button>
      <a href="index.html" class="brand">시장노트</a>
      <nav class="gnb-menu" id="gnb-menu"></nav>
      <div class="gnb-right">
        <a href="stock.html#search" class="icon-btn" aria-label="종목 검색">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></svg>
        </a>
        <button class="icon-btn" aria-label="알림">
          <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z" /><path d="M10 20.5h4" /></svg>
        </button>
        <a href="#" class="login-link">로그인</a>
      </div>
    </header>

    <div class="layout">
      <!-- 상단 메뉴와 왼쪽 메뉴는 common.js가 채운다 -->
      <aside class="sidebar" id="sidebar"></aside>
      <div class="dim" id="dim"></div>

      <main class="content wide">
        <section class="page-head">
          <h1>섹터 히트맵</h1>
          <p>칸 크기는 시가총액, 색은 등락률입니다. 업종 이름이나 아래 표의 업종을 누르면 그 업종만 강조하고, 종목 칸을 누르면 종목 상세로 갑니다.</p>
        </section>

        <div class="hm-toolbar">
          <div class="seg" id="market-seg">
            <button data-market="kospi" class="on">KOSPI</button>
            <button data-market="kosdaq">KOSDAQ</button>
          </div>
          <div class="seg" id="period-seg">
            <button data-period="0" class="on">1일</button>
            <button data-period="1">1주</button>
            <button data-period="2">1개월</button>
          </div>
        </div>

        <ul class="ticker hm-summary" id="summary"></ul>

        <div class="heatmap-wrap" id="heatmap-wrap">
          <div id="treemap"></div>
          <div class="tip" id="tip" hidden></div>
        </div>

        <div class="hm-foot">
          <div class="legend" id="legend"></div>
          <span id="hm-time"></span>
        </div>

        <section class="block">
          <div class="block-head">
            <h2>업종별 요약</h2>
            <span class="sub">시가총액 가중 평균</span>
          </div>
          <table class="sector-table" id="sector-table"></table>
        </section>

        <footer class="footer">
          <p>시장노트는 투자 판단에 참고할 정보를 제공하며, 투자 결과에 대한 책임은 투자자 본인에게 있습니다.</p>
          <p class="data-note"></p>
        </footer>
      </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script src="js/data.js"></script>
    <script src="data/prices.js"></script>
    <script src="js/live.js"></script>
    <script src="js/common.js"></script>
    <script src="js/heatmap.js"></script>
  </body>
</html>
